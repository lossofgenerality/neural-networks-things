    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
    "torch>=2.15.0",
]
